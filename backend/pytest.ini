[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = session
filterwarnings =
    # passlib imports Python's deprecated `crypt` module at load time — not fixable
    # from application code without replacing passlib entirely. The module-name
    # constraint is omitted because the stacklevel used by warnings._deprecated
    # can attribute the warning to a different caller frame.
    ignore:'crypt' is deprecated and slated for removal in Python 3.13:DeprecationWarning
    # Pydantic v2 class-based config — fixed in config.py; ignore residual from
    # any other transitive paths.
    ignore:Support for class-based `config` is deprecated:DeprecationWarning
